name: Java CI using Gradle and Nebula

on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - master
      - release/*
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:

  find-untagged-commit:
    name: find untagged commit
    uses: pavelfomin/shared-workflows/.github/workflows/find-untagged-commit.yml@v0
    secrets: inherit

  build:

    # `needs` is what populates the needs context below - without it the hash is always empty
    needs: find-untagged-commit
    runs-on: ubuntu-latest
    # The GITHUB_TOKEN secret is set to an access token for the repository each time a job in a workflow begins.
    # You should set the permissions for this access token in the workflow file to grant
    # read access for the contents scope and write access for the packages scope.
    permissions:
      contents: write
      packages: write
      pull-requests: write
      checks: write
    if: ${{ needs.find-untagged-commit.outputs.hash || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 0 indicates all history for all branches and tags
          fetch-depth: "0"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: git status
        run: |
          git status
          git remote -v

      # Nebula validates git user.name/email when the plugin is applied (configuration time),
      # so this must run before any gradlew invocation. Derive the identity from the HEAD commit
      # so the release tag is attributed to the commit's author without hardcoding a name/email.
      - name: Configure git identity from HEAD commit
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "$(git log -1 --format='%an')"
          git config user.email "$(git log -1 --format='%ae')"

      - name: Build for PR
        if: github.event_name == 'pull_request'
        run: ./gradlew build -Prelease.stage=final

      - name: Add test report to PR checks
        uses: dorny/test-reporter@v3
        if: (success() || failure()) && github.event_name == 'pull_request'
        with:
          name: Tests report
          path: ${{ github.workspace }}/build/test-results/test/*.xml
          reporter: java-junit

      - name: Add code coverage to PR
        id: jacoco
        uses: madrapps/jacoco-report@v1.8
        if: github.event_name == 'pull_request'
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 90
          min-coverage-changed-files: 99

      - name: Build, publish and tag release
        if: github.event_name != 'pull_request'
        run: ./gradlew build publish final -Prelease.stage=final
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nebula's `final` task creates and pushes the tag, but nothing creates a GitHub Release,
      # so /releases/tag/<tag> falls back to rendering the bare tag annotation - and since
      # nebula-release 21 that annotation is just "Release of <version>" with no commit list.
      # Creating a Release makes GitHub render generated notes (merged PRs) on that same page.
      #
      # The tag can't come from github.ref_name: this job is triggered by a push to master and
      # nebula creates the tag mid-job, so the ref is the branch. Derive it the same way
      # scripts/deploy-latest.sh does. previous_tag pins the notes comparison base to the
      # preceding tag - left to GitHub it defaults to the last *release*, and the existing
      # release gaps (v4.16.0-v4.19.0, v4.22.0) would make the first run re-list old PRs.
      - name: Determine release tag
        id: release_tag
        if: github.event_name != 'pull_request'
        run: |
          tag=$(git describe --abbrev=0 --tags --first-parent)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$(git describe --abbrev=0 --tags --first-parent "${tag}^")" >> "$GITHUB_OUTPUT"

      # Reruns are safe: the action updates an existing release rather than failing.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          previous_tag: ${{ steps.release_tag.outputs.previous_tag }}
          generate_release_notes: true

      # upload full test report (e.g. in case stdout / stderr is needed)
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: Tests report
          path: ${{ github.workspace }}/build/reports/tests
          retention-days: 1

      - name: deploy new release
        if: github.event_name != 'pull_request'
        run: scripts/deploy-latest.sh
